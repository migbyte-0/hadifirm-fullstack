[build]
builder = "nixpacks"
nixpacksConfigPath = "nixpacks.toml"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.pdo_pgsql", "php82Extensions.gd", "php82Extensions.bcmath", "php82Extensions.zip", "php82Extensions.intl", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "nodejs_22"]

[build.nixpacksPlan.phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --ignore-platform-reqs"]

[build.nixpacksPlan.phases.build]
cmds = [
    "npm ci",
    "npm run build",
    "mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs bootstrap/cache",
    "chmod -R 775 storage bootstrap/cache",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[deploy]
startCommand = "php artisan config:clear && php artisan cache:clear && php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
