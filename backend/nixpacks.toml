[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_pgsql", "php84Extensions.gd", "php84Extensions.bcmath", "php84Extensions.zip", "php84Extensions.intl", "php84Extensions.redis", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.openssl", "nodejs", "yarn"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --ignore-platform-reqs",
    "php artisan optimize:clear",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
